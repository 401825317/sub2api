name: Build Grok Video E2E Image

on:
  push:
    branches:
      - codex/grok-video-e2e-20260818

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v6

      - name: Resolve build date
        id: metadata
        shell: bash
        run: echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push immutable amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: docker.io/401825317/sub2api:grok-video-e2e-20260818-${{ github.sha }}
          build-args: |
            VERSION=0.1.173-grok-video-e2e-20260818
            COMMIT=${{ github.sha }}
            DATE=${{ steps.metadata.outputs.date }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=0.1.173-grok-video-e2e-20260818
